<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotacao de Plano de Saude</title>
  <style>
    :root { --bg:#f4f1ea; --ink:#12211b; --green:#0b3d2e; --card:#fff; --muted:#5b6b64; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family: Georgia, serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:1080px; margin:0 auto; padding:20px 16px 80px; }
    header { display:flex; justify-content:space-between; align-items:center; padding:8px 0 24px; }
    .logo { font-weight:700; color:var(--green); }
    .badge { font-size:12px; background:#e7efe9; color:var(--green); padding:6px 10px; border-radius:999px; }
    h1 { font-size:clamp(28px,5vw,48px); line-height:1.12; max-width:16ch; }
    .lead { margin:14px 0 22px; color:var(--muted); max-width:42ch; font-size:18px; }
    .grid { display:grid; gap:22px; grid-template-columns:1.1fr .9fr; }
    @media(max-width:820px){ .grid{grid-template-columns:1fr;} }
    .card { background:var(--card); border-radius:18px; padding:22px; box-shadow:0 10px 40px rgba(18,33,27,.08); }
    label { display:block; font-size:13px; margin:12px 0 6px; color:var(--green); }
    input,select { width:100%; padding:12px; border:1px solid #d7ddd9; border-radius:10px; font:inherit; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button,.btn { width:100%; border:0; background:#25D366; color:#072; font-weight:700; padding:14px; border-radius:12px; cursor:pointer; font-size:16px; text-decoration:none; display:inline-block; text-align:center; }
    a.secondary { background:var(--green); color:#fff; margin-top:8px; }
    .lgpd { font-size:12px; color:var(--muted); margin-top:10px; display:flex; gap:8px; }
    footer { margin-top:40px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" id="brand">NEXO SAUDE</div>
      <div class="badge">Fila virtual · WhatsApp</div>
    </header>
    <div class="grid">
      <section>
        <h1>Compare planos e entre na fila do WhatsApp.</h1>
        <p class="lead">Voce recebe uma senha. O corretor chama na ordem. Sem lista fria.</p>
        <p><a href="/parceiros">Sou corretor</a> · <a href="/fila">Painel da fila</a></p>
      </section>
      <section class="card">
        <h2>Tirar senha</h2>
        <form id="f">
          <label>Nome</label><input name="nome" required />
          <div class="row">
            <div><label>WhatsApp</label><input name="whatsapp" required /></div>
            <div><label>Cidade</label><input name="cidade" required placeholder="Rio de Janeiro" /></div>
          </div>
          <div class="row">
            <div><label>Tipo</label>
              <select name="tipo"><option value="individual">Individual</option><option value="familiar">Familiar</option><option value="empresarial">Empresarial / PME</option></select>
            </div>
            <div><label>Vidas</label>
              <select name="vidas"><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option><option>10+</option></select>
            </div>
          </div>
          <label class="lgpd"><input type="checkbox" name="lgpd" required /> Autorizo contato por WhatsApp.</label>
          <button style="margin-top:14px">Entrar na fila</button>
        </form>
      </section>
    </div>
    <footer>Canal de cotacao. Nao somos operadora.</footer>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const brand = q.get("wl");
    if (brand) document.getElementById("brand").textContent = brand.toUpperCase();
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target).entries());
      d.wl = brand;
      try { await fetch("/api/lead", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(d) }); } catch(x){}
      let code = "";
      try {
        const r = await (await fetch("/api/fila", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ action:"enter", ...d }) })).json();
        code = r.ticket && r.ticket.code;
      } catch(x){}
      location.href = code ? ("/senha?code=" + encodeURIComponent(code)) : "/fila";
    };
  </script>
</body></html>
