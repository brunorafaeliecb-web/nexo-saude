<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXO · CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#10231c; --muted:#5d6f67; --line:#dce6e0; --bg:#eef3ef; --paper:#fff; --green:#0d4a38; --good:#1b7a4a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Instrument Sans", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:var(--green); color:#fff; }
    header a { color:#d7eee4; text-decoration:none; margin-left:14px; font-size:13px; }
    .layout { display:grid; grid-template-columns:1fr 400px; min-height:calc(100vh - 52px); }
    @media (max-width:980px){ .layout{grid-template-columns:1fr;} }
    .board { display:grid; grid-template-columns:repeat(7,minmax(168px,1fr)); gap:10px; padding:14px; overflow-x:auto; }
    .col { background:#f7faf8; border:1px solid var(--line); border-radius:14px; min-height:72vh; padding:10px; }
    .col h3 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:11px; margin-bottom:8px; cursor:pointer; }
    .card.active { border-color:var(--green); box-shadow:0 0 0 3px rgba(13,74,56,.12); }
    .meta { color:var(--muted); font-size:12px; margin-top:4px; }
    .bar { height:4px; background:#e4ece7; border-radius:99px; margin-top:8px; overflow:hidden; }
    .bar i { display:block; height:100%; background:var(--good); }
    .dossier { background:var(--paper); border-left:1px solid var(--line); padding:18px; overflow:auto; }
    .item { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; font-size:13px; padding:8px; border:1px solid var(--line); border-radius:10px; margin:6px 0; }
    .item.on { background:#eef8f1; border-color:#bfe3cc; }
    .dot { width:16px; height:16px; border-radius:50%; border:2px solid #bbb; }
    .item.on .dot { background:var(--good); border-color:var(--good); }
    .val { color:var(--muted); font-size:12px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 10px; margin:6px 0 10px; font:inherit; }
    button { border:0; background:var(--green); color:#fff; border-radius:10px; padding:10px 12px; cursor:pointer; font-weight:600; }
    button.ghost { background:#e7eeea; color:var(--ink); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .msg { padding:8px 10px; border-radius:12px; margin:6px 0; font-size:13px; }
    .in { background:#eef6f1; } .out { background:#e8eefc; } .note { background:#fff6db; }
    .thread { max-height:220px; overflow:auto; }
    .empty { color:var(--muted); padding:40px 10px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <div><b>NEXO CRM</b> · dossie + proposta</div>
    <nav><a href="/">Landing</a><a href="/fila">Fila</a><a href="/parceiros">Vitrine</a></nav>
  </header>
  <div class="layout">
    <div class="board" id="board"></div>
    <aside class="dossier" id="side"><p class="empty">Selecione um card. CPF e docs enviados no WhatsApp entram sozinhos no checklist.</p></aside>
  </div>
  <script>
    const STAGES = ["novo","qualificando","cotacao","proposta","aguardando","ganho","perdido"];
    let DATA = []; let OPEN = null;
    const esc = (s) => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    async function load(){ DATA=((await(await fetch("/api/crm")).json()).leads)||[]; draw(); if(OPEN) show(OPEN); }
    function draw(){
      board.innerHTML = STAGES.map(st => {
        const items = DATA.filter(l => (l.stage||"novo")===st);
        return `<div class="col"><h3>${st} · ${items.length}</h3>${items.map(card).join("")}</div>`;
      }).join("");
      board.querySelectorAll("[data-id]").forEach(el => el.onclick = () => show(el.dataset.id));
    }
    function card(l){
      const p = l.docsTotal ? Math.round((l.docsReady/l.docsTotal)*100) : 0;
      return `<div class="card ${OPEN===l.id?"active":""}" data-id="${l.id}"><b>${esc(l.nome||"Sem nome")}</b>
        <div class="meta">${esc(l.tipo||"")} · ${esc(String(l.vidas||""))} vidas · ${esc(l.cidade||"")}</div>
        <div class="meta">${l.docsReady||0}/${l.docsTotal||0} itens da proposta</div>
        <div class="bar"><i style="width:${p}%"></i></div></div>`;
    }
    function show(id){
      OPEN=id; draw();
      const l = DATA.find(x => x.id===id); if(!l) return;
      const d = l.dossier||{}; const items=l.checklist||[];
      const msgs=(l.messages||[]).map(m=>`<div class="msg ${m.dir}">${esc(m.text)}<div class="meta">${esc(m.at||"")}</div></div>`).join("");
      side.innerHTML = `
        <h2>${esc(l.nome||"Lead")}</h2>
        <p class="meta">${esc(l.whatsapp)} · ${l.docsReady}/${l.docsTotal} prontos</p>
        <div class="actions">
          <a href="/proposta?id=${encodeURIComponent(l.id)}"><button type="button">Gerar proposta</button></a>
          <a href="https://wa.me/${String(l.whatsapp||"").replace(/\D/g,"")}"><button class="ghost" type="button">WhatsApp</button></a>
        </div>
        <h3 style="margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Checklist da proposta</h3>
        ${items.map(it=>`<div class="item ${it.ready?"on":""}"><span class="dot"></span><span>${esc(it.label)}</span><span class="val">${it.ready?esc(typeof it.value==="object"?(it.value.name||"arquivo"):it.value):"faltando"}</span></div>`).join("")}
        <label>Estagio</label>
        <select id="st">${STAGES.map(s=>`<option ${s===(l.stage||"novo")?"selected":""}>${s}</option>`).join("")}</select>
        <label>CPF</label><input id="cpf" value="${esc(d.cpf||"")}" />
        <label>RG</label><input id="rg" value="${esc(d.rg||"")}" />
        <label>Nascimento</label><input id="nascimento" value="${esc(d.nascimento||"")}" />
        <label>Nome da mae</label><input id="mae" value="${esc(d.mae||"")}" />
        <label>E-mail</label><input id="email" value="${esc(d.email||"")}" />
        <label>CEP</label><input id="cep" value="${esc(d.cep||"")}" />
        <label>Endereco</label><input id="endereco" value="${esc(d.endereco||"")}" />
        <select id="fileid"><option value="doc_rg">Foto RG</option><option value="doc_cpf">Foto CPF</option><option value="doc_comp">Comprovante</option><option value="doc_cnpj">CNPJ</option></select>
        <textarea id="note" placeholder="Nota interna"></textarea>
        <button id="save">Salvar dossie</button>
        <div class="thread">${msgs || "<p class=meta>O CPF enviado no Zap entra sozinho aqui.</p>"}</div>`;
      document.getElementById("save").onclick = async () => {
        await fetch("/api/crm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
          id:l.id, stage:st.value, note:note.value, file:{id:fileid.value,name:"manual"},
          dossier:{cpf:cpf.value,rg:rg.value,nascimento:nascimento.value,mae:mae.value,email:email.value,cep:cep.value,endereco:endereco.value}
        })});
        await load();
      };
    }
    load(); setInterval(load,12000);
  </script>
</body></html>
