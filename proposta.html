<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposta · NEXO</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family:"Instrument Sans", system-ui, sans-serif; background:#eef3ef; margin:0; color:#10231c; }
    .sheet { max-width:820px; margin:24px auto; background:#fff; padding:36px; border-radius:16px; }
    table { width:100%; border-collapse:collapse; margin:16px 0; }
    td, th { border-bottom:1px solid #dce6e0; text-align:left; padding:8px 4px; font-size:14px; }
    .ok { color:#1b7a4a; font-weight:600; } .no { color:#9a3412; } .muted { color:#5d6f67; }
    button { background:#0d4a38; color:#fff; border:0; padding:10px 14px; border-radius:10px; }
    @media print { button, a { display:none; } }
  </style>
</head>
<body>
  <div class="sheet" id="s">Carregando dossie…</div>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    (async () => {
      const data = await (await fetch("/api/crm")).json();
      const l = (data.leads || []).find((x) => x.id === id);
      if (!l) { s.textContent = "Lead nao encontrado. Abra pelo CRM."; return; }
      const d = l.dossier || {}; const items = l.checklist || []; const missing = items.filter((i) => !i.ready);
      s.innerHTML = `
        <p class="muted">NEXO SAUDE · minuta de proposta</p>
        <h1>${l.nome || "Cliente"}</h1>
        <p class="muted">Gerado com o que ja esta no CRM. Itens faltando nao sao inventados.</p>
        <p><button onclick="print()">Imprimir / PDF</button> <a href="/crm">Voltar ao CRM</a></p>
        <h3>Dados ja no dossie</h3>
        <table><tr><th>Campo</th><th>Valor</th><th>Status</th></tr>
          ${items.map((i) => `<tr><td>${i.label}</td><td>${i.ready ? (typeof i.value === "object" ? (i.value.name || "arquivo") : i.value) : "—"}</td><td class="${i.ready?"ok":"no"}">${i.ready?"ticado":"faltando"}</td></tr>`).join("")}
        </table>
        <p>CPF: <b>${d.cpf || "faltando"}</b> · Nascimento: <b>${d.nascimento || "faltando"}</b> · Cidade: <b>${d.cidade || l.cidade || "faltando"}</b></p>
        ${missing.length ? `<p class="no">Ainda falta: ${missing.map((m)=>m.label).join(", ")}.</p>` : `<p class="ok">Dossie completo para minuta. Conferir com corretor habilitado.</p>`}
        <p class="muted">Isto nao e proposta da operadora. E o pacote do CRM para protocolar no sistema da operadora.</p>`;
    })();
  </script>
</body></html>
