name: BRafaelS NEXO source syntax audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript source syntax checks
        run: |
          set -euo pipefail
          find api -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check
          python3 -m json.tool vercel.json > /dev/null
          printf 'JS and Vercel config syntax PASS\n'
