name: BRafaelS NEXO frontend access compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser session integration without exposing admin keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name,route in [('crm.html','/api/crm'),('fila.html','/api/fila')]:
            s=Path(name).read_text()
            api=Path('api/'+route.rsplit('/',1)[-1]+'.js').read_text()
            assert 'adminFetch' in s and '/api/admin-session' in s and 'requireAdmin' in api
            assert 'x-admin-pin' not in s
            print('BROWSER_SESSION_COMPATIBILITY_PASS',name,route)
          print('SERVER_SESSION_COMPATIBILITY_VALIDATED')
          PY
