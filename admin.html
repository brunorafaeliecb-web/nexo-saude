<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>NEXO SAUDE Admin</title><style>body{font-family:Georgia,serif;background:#f4f1ea;margin:0;padding:24px}.w{max-width:900px;margin:0 auto}.card{background:#fff;padding:14px;border-radius:12px;margin:8px 0}</style></head><body><div class="w"><h1>Admin pool</h1><div id="list"></div></div><script>const pin=prompt("PIN admin")||"";fetch("/api/leads",{headers:{"x-admin-pin":pin}}).then(r=>r.json()).then(d=>{document.getElementById("list").innerHTML=(d.leads||[]).map(l=>`<div class=card><b>${l.status||"aberto"}</b> · ${l.nome} · ${l.whatsapp} · ${l.tipo} · ${l.cidade} · ${l.buyer?.nome||"-"}</div>`).join("")||"Vazio";});</script></body></html>
